<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Advanced scientific calculator built with HTML5, CSS3 and vanilla JavaScript." />
  <meta name="color-scheme" content="light dark" />
  <title>Scientific Calculator — Digital Club</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    /* Apply the saved theme before the first paint to avoid a flash. */
    (function () {
      try {
        var saved = localStorage.getItem('sci-calc:theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <span class="brand__icon" aria-hidden="true"></span>
        <div class="brand__text">
          <h1 class="brand__title">Scientific Calculator</h1>
          <p class="brand__subtitle">Smart Calculations Made Simple</p>
        </div>
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
        aria-label="Switch to dark theme"
        aria-pressed="false"
        title="Toggle theme"
      >
        <span id="themeToggleIcon" aria-hidden="true">☾</span>
      </button>
    </header>

    <main class="workspace" id="workspace">
      <section class="calculator" id="calculator" aria-label="Scientific calculator">
        <div class="display">
          <div class="display__top">
            <span class="mode-chip" id="modeChip">DEG</span>
            <span class="display__context" id="displayContext" aria-live="polite"></span>
          </div>
          <div class="display__main" id="displayMain" role="status" aria-live="polite">0</div>
        </div>

        <div class="controls">
          <div class="segmented" role="group" aria-label="Angle unit">
            <button type="button" class="segmented__btn is-active" data-mode="DEG" aria-pressed="true">DEG</button>
            <button type="button" class="segmented__btn" data-mode="RAD" aria-pressed="false">RAD</button>
          </div>
          <span class="controls__spacer"></span>
          <button type="button" class="control-btn" id="historyToggle" aria-expanded="false" aria-controls="historyPanel">
            History
          </button>
          <button type="button" class="control-btn" id="copyBtn" aria-label="Copy result">
            Copy
          </button>
        </div>

        <div class="keys keys--scientific" id="scientific">
          <button type="button" class="key key--fn" data-action="function" data-value="sin" title="Sine">sin</button>
          <button type="button" class="key key--fn" data-action="function" data-value="cos" title="Cosine">cos</button>
          <button type="button" class="key key--fn" data-action="function" data-value="tan" title="Tangent">tan</button>
          <button type="button" class="key key--fn" data-action="function" data-value="asin" title="Inverse sine">asin</button>

          <button type="button" class="key key--fn" data-action="function" data-value="acos" title="Inverse cosine">acos</button>
          <button type="button" class="key key--fn" data-action="function" data-value="atan" title="Inverse tangent">atan</button>
          <button type="button" class="key key--fn" data-action="function" data-value="log" title="Logarithm base 10">log</button>
          <button type="button" class="key key--fn" data-action="function" data-value="ln" title="Natural logarithm">ln</button>

          <button type="button" class="key key--fn" data-action="function" data-value="√" title="Square root" aria-label="Square root">√</button>
          <button type="button" class="key key--fn" data-action="squared" title="Square">x²</button>
          <button type="button" class="key key--fn" data-action="power" title="Power">xʸ</button>
          <button type="button" class="key key--fn" data-action="reciprocal" title="Reciprocal">1/x</button>

          <button type="button" class="key key--fn" data-action="constant" data-value="π" title="Pi" aria-label="Pi">π</button>
          <button type="button" class="key key--fn" data-action="constant" data-value="e" title="Euler's number">e</button>
          <button type="button" class="key key--fn" data-action="postfix" data-value="!" title="Factorial">x!</button>
          <button type="button" class="key key--fn" data-action="function" data-value="abs" title="Absolute value" aria-label="Absolute value">|x|</button>
        </div>

        <div class="keys keys--keypad" id="keypad">
          <button type="button" class="key key--clear" data-action="clear" title="Clear all (Esc)">AC</button>
          <button type="button" class="key key--fn" data-action="open-paren" title="Open bracket">(</button>
          <button type="button" class="key key--fn" data-action="close-paren" title="Close bracket">)</button>
          <button type="button" class="key key--delete" data-action="delete" title="Delete (Backspace)">DEL</button>

          <button type="button" class="key key--num" data-action="digit" data-value="7">7</button>
          <button type="button" class="key key--num" data-action="digit" data-value="8">8</button>
          <button type="button" class="key key--num" data-action="digit" data-value="9">9</button>
          <button type="button" class="key key--op" data-action="operator" data-value="÷">÷</button>

          <button type="button" class="key key--num" data-action="digit" data-value="4">4</button>
          <button type="button" class="key key--num" data-action="digit" data-value="5">5</button>
          <button type="button" class="key key--num" data-action="digit" data-value="6">6</button>
          <button type="button" class="key key--op" data-action="operator" data-value="×">×</button>

          <button type="button" class="key key--num" data-action="digit" data-value="1">1</button>
          <button type="button" class="key key--num" data-action="digit" data-value="2">2</button>
          <button type="button" class="key key--num" data-action="digit" data-value="3">3</button>
          <button type="button" class="key key--op" data-action="operator" data-value="−">−</button>

          <button type="button" class="key key--num" data-action="digit" data-value="0">0</button>
          <button type="button" class="key key--num" data-action="decimal">.</button>
          <button type="button" class="key key--fn" data-action="postfix" data-value="%">%</button>
          <button type="button" class="key key--op" data-action="operator" data-value="+">+</button>

          <button type="button" class="key key--equals" data-action="equals" title="Calculate (Enter)">=</button>
        </div>
      </section>

      <aside class="history" id="historyPanel" aria-label="Calculation history" aria-hidden="true">
        <div class="history__inner">
          <header class="history__header">
            <div>
              <h2 class="history__title">History</h2>
              <p class="history__count" id="historyCount">No calculations yet</p>
            </div>
            <div class="history__actions">
              <button type="button" class="history__clear" id="historyClear">Clear</button>
              <button type="button" class="history__close" id="historyClose" aria-label="Close history">×</button>
            </div>
          </header>

          <p class="history__empty" id="historyEmpty">
            Nothing saved yet. Press <strong>=</strong> and the calculation appears here.
          </p>
          <ul class="history__list" id="historyList"></ul>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      DIGITAL CLUB — LEARN. CREATE. INNOVATE.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/parser.js"></script>
  <script src="js/history.js"></script>
  <script src="js/calculator.js"></script>
</body>
</html>
